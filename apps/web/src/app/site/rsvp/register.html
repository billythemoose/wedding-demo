<div class="registration">

  <!-- it could be two buttons, one "self", one "plus one" -->
  <!-- plus one adds person, self removes person -->
  <form class="register" [formGroup]="form" (ngSubmit)="submit()">

    <div class="picker">
      <button class="column" type="button" (click)="changeCount(false)" [disabled]="!plusOne"> Solo</button>
      <button class="column" type="button" (click)="changeCount(true)" [disabled]="plusOne"> Plus One</button>
    </div>

    <div formArrayName="people">
      @for (person of people.controls; track person) {
        <div [formGroup]="groupFromControl(person)">
          <div class="form-group">
            <label for="first-name">First Name</label>
            <input id="first-name" type="text" formControlName="firstName" />
          </div>
          <div class="form-group">
            <label for="last-name">Last Name</label>
            <input id="last-name" type="text" formControlName="lastName" />
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input id="phone" type="tel" formControlName="phone" />
          </div>
          <div class="form-group">
            <label class="radio-label">Attending?</label>
            <label>
              <input type="radio" formControlName="attending" [value]="true" />
              Yes
            </label>
            <label>
              <input type="radio" formControlName="attending" [value]="false" />
              No
            </label>
          </div>
        </div>
      }
    </div>

    <div>
        <div *ngIf="!isLoading">
            <button type="submit" [disabled]="!form.valid">Save</button>
        </div>
        <div *ngIf="isLoading">
            <button type="submit" [disabled]="!true">
                <span class="loader"></span>
            </button>
        </div>
      
    </div>
  </form>
</div>
